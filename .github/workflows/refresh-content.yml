name: Refresh wiki content

# Re-fetches the official WalkScape wiki, rebuilds data/*.json + index.html, and
# opens a pull request with the result. Nothing is ever pushed to main: content
# drift is a judgement call, so a human reviews the summary in the PR body.
#
# No secrets, no API key, no third-party service. The wiki is server-rendered
# MediaWiki, so fetch_pages.py reads its public action=parse endpoint directly:
# every run is free, which is why this can re-fetch the whole manifest rather
# than rationing pages. The only cost is politeness, hence the request pause.

on:
  schedule:
    # Mondays 04:17 UTC. Off the hour on purpose: scheduled runs bunched on the
    # hour are the first thing GitHub delays when the runner pool is busy.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Ignore the cached copy: drop pages that fail to re-fetch instead of keeping the previous copy"
        type: boolean
        default: false
      dry_run:
        description: "Plan only - fetches nothing and opens no PR"
        type: boolean
        default: false
      pause:
        description: "Seconds between wiki requests (politeness throttle)"
        type: string
        default: "0.5"

permissions:
  contents: write
  pull-requests: write

# One refresh at a time; a second run must not race the first onto the branch.
concurrency:
  group: refresh-content
  cancel-in-progress: false

env:
  BRANCH: automation/content-refresh
  FULL_REFRESH: ${{ inputs.full_refresh || false }}
  DRY_RUN: ${{ inputs.dry_run || false }}
  PAUSE: ${{ inputs.pause || '0.5' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Hundreds of pages scraped in throttled batches, then ~2000 images fetched.
    timeout-minutes: 180

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history: the run pushes a branch and reads the committed build
          # back out with `git show HEAD:...` to diff against.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # .firecrawl/ is gitignored, so CI never inherits the local page cache.
      # This restores the previous run's copy as a floor: every page is still
      # re-fetched, but fetch_pages.py only overwrites a file once the new copy
      # has arrived intact, so a page that fails falls back to the last
      # known-good markdown instead of vanishing from the site.
      # GitHub evicts caches untouched for 7 days and this job runs every 7, so
      # a miss now and then is expected -- it costs resilience, never content:
      # the durable manifest lives in the committed data/, not in this cache.
      - name: Restore the page cache
        id: page-cache
        if: env.FULL_REFRESH != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .firecrawl
          key: wiki-md-${{ github.run_id }}
          restore-keys: |
            wiki-md-

      # data/img_cache/ is gitignored too. ~2000 image downloads, no API cost,
      # but slow and needlessly rude to the wiki's host to repeat every week.
      - name: Restore the image cache
        uses: actions/cache/restore@v4
        with:
          path: data/img_cache
          key: img-cache-${{ github.run_id }}
          restore-keys: |
            img-cache-

      - name: Refresh the page cache
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            python fetch_pages.py --list
            exit 0
          fi
          # Round 1: re-fetch every page in the manifest, so existing pages
          # pick up wiki edits rather than staying frozen at the cached copy.
          python fetch_pages.py --refresh --pause "${PAUSE}"
          # Re-run link discovery over the fresh markdown, then round 2 picks
          # up pages that only became reachable because of those edits.
          python build_urls.py
          python fetch_pages.py --pause "${PAUSE}"

      - name: Build data
        if: env.DRY_RUN != 'true'
        run: python build_data.py

      - name: Build images
        if: env.DRY_RUN != 'true'
        run: python build_images.py

      - name: Build the site
        if: env.DRY_RUN != 'true'
        run: python build_site.py

      - name: Check the build against the committed one
        id: check
        if: env.DRY_RUN != 'true'
        run: |
          python .github/scripts/check_build.py \
            --pr-body "${RUNNER_TEMP}/pr-body.md"

      # Saved only on success, so the restored floor is always a build that
      # actually passed the guard rails.
      - name: Save the page cache
        if: success() && env.DRY_RUN != 'true'
        uses: actions/cache/save@v4
        with:
          path: .firecrawl
          key: wiki-md-${{ github.run_id }}

      - name: Save the image cache
        if: always() && env.DRY_RUN != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/img_cache
          key: img-cache-${{ github.run_id }}

      - name: Commit the regenerated build
        id: commit
        if: env.DRY_RUN != 'true' && steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          # Every generated file, or the build goes internally inconsistent.
          # img_meta.json was missing here: it carries the sprite list and the
          # dedupe alias map keyed by image id, so leaving it behind while
          # images.json is regenerated points aliases at ids that no longer
          # exist -- silently blank images rather than a failed build.
          #
          # index.html is deliberately absent: it is rendered by
          # deploy-pages.yml from the data below, not stored. It is still built
          # in this job so the guard rails can measure it.
          git add -- \
            data/wiki_data.json \
            data/img_map.json \
            data/images.json \
            data/img_meta.json \
            data/redirects.json \
            data/master_urls.txt \
            data/urls.txt \
            data/home.md
          if git diff --cached --quiet; then
            echo "nothing staged after all"
            echo "pushed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git commit -m "Refresh wiki content ($(date -u +%Y-%m-%d))" \
                     -m "Regenerated from a fresh fetch of wiki.walkscape.app by the scheduled content refresh."
          # The branch is owned exclusively by this workflow and is rebuilt from
          # main on every run, so it is force-updated rather than merged into.
          git push --force origin "${BRANCH}"
          echo "pushed=true" >> "${GITHUB_OUTPUT}"

      - name: Open or update the pull request
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Refresh wiki content ($(date -u +%Y-%m-%d))"
          existing="$(gh pr list --head "${BRANCH}" --state open \
                       --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
            echo "updated PR #${existing}"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" \
              --head "${BRANCH}" --title "${title}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
          fi

      - name: Report when nothing changed
        if: env.DRY_RUN != 'true' && steps.check.outputs.changed != 'true'
        run: |
          echo "The wiki has not changed since the committed build; no pull request opened." \
            >> "${GITHUB_STEP_SUMMARY}"
