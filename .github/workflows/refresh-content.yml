name: Refresh wiki content

# Re-crawls the official WalkScape wiki, rebuilds data/*.json + index.html, and
# opens a pull request with the result. Nothing is ever pushed to main: content
# drift is a judgement call, so a human reviews the summary in the PR body.
#
# Requires one repository secret:
#   FIRECRAWL_API_KEY  -- https://firecrawl.dev dashboard; the CLI also reads it
#                         from this exact env var name, so it is never passed on
#                         the command line.
#
# Cost: roughly one Firecrawl credit per wiki page per run, and the crawl
# manifest (data/master_urls.txt plus the page set of the committed build) is
# currently in the high hundreds. That is why this is weekly rather than nightly,
# and why `max_urls` hard-stops the run if the manifest ever balloons.
# See the docs in .github/scripts/crawl_refresh.py.

on:
  schedule:
    # Mondays 04:17 UTC. Off the hour on purpose: scheduled runs bunched on the
    # hour are the first thing GitHub delays when the runner pool is busy.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Ignore the cached crawl: drop pages that fail to re-scrape instead of keeping the previous copy"
        type: boolean
        default: false
      dry_run:
        description: "Plan only - calls no Firecrawl API, spends no credits, opens no PR"
        type: boolean
        default: false
      max_age_ms:
        description: "Firecrawl --max-age in ms (0 = force a fully fresh fetch at full credit cost)"
        type: string
        default: "86400000"
      batch_size:
        description: "URLs per firecrawl invocation"
        type: string
        default: "8"
      batch_delay:
        description: "Seconds between batches"
        type: string
        default: "10"
      max_urls:
        description: "Abort if the crawl manifest exceeds this many pages (credit guard)"
        type: string
        default: "800"

permissions:
  contents: write
  pull-requests: write

# One refresh at a time; a second run must not race the first onto the branch.
concurrency:
  group: refresh-content
  cancel-in-progress: false

env:
  BRANCH: automation/content-refresh
  FIRECRAWL_CLI_VERSION: "1.19.6"
  FULL_REFRESH: ${{ inputs.full_refresh || false }}
  DRY_RUN: ${{ inputs.dry_run || false }}
  MAX_AGE_MS: ${{ inputs.max_age_ms || '86400000' }}
  BATCH_SIZE: ${{ inputs.batch_size || '8' }}
  BATCH_DELAY: ${{ inputs.batch_delay || '10' }}
  MAX_URLS: ${{ inputs.max_urls || '800' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Hundreds of pages scraped in throttled batches, then ~2000 images fetched.
    timeout-minutes: 180

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history: the run pushes a branch and reads the committed build
          # back out with `git show HEAD:...` to diff against.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Firecrawl CLI
        run: npm install --global "firecrawl@${FIRECRAWL_CLI_VERSION}"

      # .firecrawl/ is gitignored, so CI never inherits the local crawl cache.
      # This restores the previous run's copy as a floor: every page is still
      # re-scraped, but a page whose fresh scrape fails falls back to the last
      # known-good markdown instead of vanishing from the site.
      # GitHub evicts caches untouched for 7 days and this job runs every 7, so
      # a miss now and then is expected -- it costs resilience, never content:
      # the durable manifest lives in the committed data/, not in this cache.
      - name: Restore the crawl cache
        id: crawl-cache
        if: env.FULL_REFRESH != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .firecrawl
          key: firecrawl-md-${{ github.run_id }}
          restore-keys: |
            firecrawl-md-

      # data/img_cache/ is gitignored too. ~2000 image downloads, no API cost,
      # but slow and needlessly rude to the wiki's host to repeat every week.
      - name: Restore the image cache
        uses: actions/cache/restore@v4
        with:
          path: data/img_cache
          key: img-cache-${{ github.run_id }}
          restore-keys: |
            img-cache-

      - name: Check Firecrawl auth and credits
        if: env.DRY_RUN != 'true'
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FIRECRAWL_API_KEY}" ]; then
            echo "::error::the FIRECRAWL_API_KEY repository secret is not set"
            exit 1
          fi
          firecrawl --status || echo "::warning::could not read Firecrawl status"

      - name: Refresh the crawl cache
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          set -euo pipefail
          args=(
            --batch-size "${BATCH_SIZE}"
            --batch-delay "${BATCH_DELAY}"
            --max-age "${MAX_AGE_MS}"
            --max-urls "${MAX_URLS}"
            --discovery-rounds 2
          )
          if [ "${FULL_REFRESH}" = "true" ]; then args+=(--full-refresh); fi
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          python .github/scripts/crawl_refresh.py "${args[@]}"

      - name: Build data
        if: env.DRY_RUN != 'true'
        run: python build_data.py

      - name: Build images
        if: env.DRY_RUN != 'true'
        run: python build_images.py

      - name: Build the site
        if: env.DRY_RUN != 'true'
        run: python build_site.py

      - name: Check the build against the committed one
        id: check
        if: env.DRY_RUN != 'true'
        run: |
          python .github/scripts/check_build.py \
            --pr-body "${RUNNER_TEMP}/pr-body.md"

      # Saved only on success, so the restored floor is always a build that
      # actually passed the guard rails.
      - name: Save the crawl cache
        if: success() && env.DRY_RUN != 'true'
        uses: actions/cache/save@v4
        with:
          path: .firecrawl
          key: firecrawl-md-${{ github.run_id }}

      - name: Save the image cache
        if: always() && env.DRY_RUN != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/img_cache
          key: img-cache-${{ github.run_id }}

      - name: Commit the regenerated build
        id: commit
        if: env.DRY_RUN != 'true' && steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add -- \
            index.html \
            data/wiki_data.json \
            data/img_map.json \
            data/images.json \
            data/master_urls.txt \
            data/urls.txt \
            data/home.md
          if git diff --cached --quiet; then
            echo "nothing staged after all"
            echo "pushed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git commit -m "Refresh wiki content ($(date -u +%Y-%m-%d))" \
                     -m "Regenerated from a fresh crawl of wiki.walkscape.app by the scheduled content refresh."
          # The branch is owned exclusively by this workflow and is rebuilt from
          # main on every run, so it is force-updated rather than merged into.
          git push --force origin "${BRANCH}"
          echo "pushed=true" >> "${GITHUB_OUTPUT}"

      - name: Open or update the pull request
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Refresh wiki content ($(date -u +%Y-%m-%d))"
          existing="$(gh pr list --head "${BRANCH}" --state open \
                       --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
            echo "updated PR #${existing}"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" \
              --head "${BRANCH}" --title "${title}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
          fi

      - name: Report when nothing changed
        if: env.DRY_RUN != 'true' && steps.check.outputs.changed != 'true'
        run: |
          echo "The wiki has not changed since the committed build; no pull request opened." \
            >> "${GITHUB_STEP_SUMMARY}"
